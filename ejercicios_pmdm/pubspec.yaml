name: ejercicios_pmdm
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  auto_size_text: ^3.0.0
  flutter:
    sdk: flutter
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: sewer
      fonts:
        - asset: assets/fonts/sewer.ttf
    - family: freedom
      fonts:
        - asset: assets/fonts/Freedom-10eM.ttf
    

  uses-material-design: true
